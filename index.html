<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Fast Food</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: #fff;
      }
      header {
        padding: 20px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.6);
      }

      /* Slider */
      .slider {
        width: 100%;
        height: 250px;
        overflow: hidden;
        position: relative;
      }
      .slides {
        display: flex;
        width: 300%;
      }
      .slides img {
        width: 100%;
        height: 250px;
        object-fit: cover;
      }
      @keyframes slide {
        0% {
          transform: translateX(0%);
        }
        33% {
          transform: translateX(0%);
        }
        36% {
          transform: translateX(-100%);
        }
        66% {
          transform: translateX(-100%);
        }
        69% {
          transform: translateX(-200%);
        }
        100% {
          transform: translateX(-200%);
        }
      }

      .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 25px;
        padding: 30px;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        overflow: hidden;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        transition: 0.3s;
      }
      .card:hover {
        transform: translateY(-10px) scale(1.03);
      }
      .card img {
        width: 100%;
        height: 170px;
        object-fit: cover;
      }
      .card-content {
        padding: 15px;
      }
      button {
        background: linear-gradient(45deg, #ff6a00, #ee0979);
        border: none;
        padding: 10px;
        width: 100%;
        cursor: pointer;
        border-radius: 8px;
        margin-top: 10px;
        color: #fff;
        font-weight: 600;
      }

      /* Cart Panel */
      #cartPanel {
        position: fixed;
        right: -350px;
        top: 0;
        width: 320px;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        padding: 20px;
        overflow: auto;
        transition: 0.4s ease;
      }

      #cartPanel.active {
        right: 0;
      }

      .closeBtn {
        background: red;
        padding: 5px 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        margin-bottom: 10px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border-radius: 8px;
        border: none;
      }

      /* Order confirmation / message modal (matches site UI) */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(15, 32, 39, 0.75);
        backdrop-filter: blur(8px);
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .modal-overlay.hidden {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .modal-box {
        width: 100%;
        max-width: 400px;
        padding: 28px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
        color: #fff;
        font-family: "Poppins", sans-serif;
      }

      .modal-box h2 {
        margin: 0 0 14px;
        font-size: 22px;
        font-weight: 600;
      }

      .modal-box p {
        margin: 0 0 22px;
        line-height: 1.55;
        font-size: 15px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.92);
        white-space: pre-wrap;
      }

      .modal-box .modal-actions {
        margin-top: 8px;
      }

      .modal-box .modal-actions button {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <header>🍔 Rafay's Kitchen</header>

    <!-- Image Slider -->
    <div class="slider">
      <div class="slides">
        <img
          src="Perfect-Grilled-Steak-with-Herb-Butter-iowagirleats-Featured-1200x2-1.jpg"
        />
        <img src="margherita-pizza-resize-8-1.jpg" />
        <img src="Gemini_Generated_Image_4xinvq4xinvq4xin(1).png" />
      </div>
    </div>

    <div class="container" id="menu"></div>

    <!-- Cart Panel -->
    <div id="cartPanel">
      <button class="closeBtn" onclick="closeCart()">Close</button>
      <h2>🛒 Your Order</h2>
      <ul id="cartItems"></ul>
      <h3>Total: $<span id="total">0</span></h3>

      <h3>🚚 Delivery Details</h3>
      <select id="location">
        <option value="">Select Delivery Location</option>
        <option>Ayub National Park</option>
        <option>Raja Bazaar</option>
        <option>Jinnah Park</option>
        <option>Saddar Bazaar</option>
        <option>Kartarpura Food Street</option>
        <option>Army Museum Rawalpindi</option>
        <option>Rawat Fort</option>
        <option>Golra Sharif Railway Museum</option>
        <option>Liaquat Bagh</option>
        <option>Joyland Rawalpindi</option>
      </select>

      <input type="text" id="address" placeholder="Street Address" />
      <input type="text" id="phone" placeholder="Phone Number" />
      <button onclick="checkout()">Place Order</button>
    </div>

    <div
      id="modalOverlay"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-describedby="modalMessage"
    >
      <div class="modal-box" onclick="event.stopPropagation()">
        <h2 id="modalTitle"></h2>
        <p id="modalMessage"></p>
        <div class="modal-actions">
          <button type="button" onclick="closeModal()">OK</button>
        </div>
      </div>
    </div>

    <script>
      const foods = [
        {
          name: "Truffle Burger",
          price: 12,
          img: "Gemini_Generated_Image_4xinvq4xinvq4xin(1).png",
          ingredients: "Wagyu Beef, Black Truffle, Brioche Bun",
        },
        {
          name: "Gourmet Pizza",
          price: 15,
          img: "margherita-pizza-resize-8-1.jpg",
          ingredients: "Buffalo Mozzarella",
        },
        {
          name: "Loaded Fries",
          price: 9,
          img: "Loaded-Fries-Loaded-Sour-Cream-Onion-Waffle-Fries-2.jpg",
          ingredients: "Truffle Oil",
        },
        {
          name: "Signature Sandwich",
          price: 10,
          img: "fully-loaded-veggie-sandwiches-64c9667ff10bc.avif",
          ingredients: "Smoked Chicken",
        },
        {
          name: "Luxury Hot Dog",
          price: 11,
          img: "bfa_16127_2007634.webp",
          ingredients: "Angus Sausage",
        },
        {
          name: "Crispy Chicken Deluxe",
          price: 13,
          img: "crispy chicken deluxe 1.jpg",
          ingredients: "Organic Chicken",
        },
        {
          name: "Mexican Tacos",
          price: 12,
          img: "images.jpg",
          ingredients: "Beef",
        },
        {
          name: "Premium Wrap",
          price: 11,
          img: "McWrap-21.jpg",
          ingredients: "Garlic Aioli",
        },
        {
          name: "Italian Pasta",
          price: 14,
          img: "Authentic-Neapolitan-Pizza-Dough-Recipe-45.jpg",
          ingredients: "Durum Wheat",
        },
        {
          name: "Chicken Nuggets",
          price: 10,
          img: "Homemade-Chicken-Nuggets-Recipe-500x500.jpg",
          ingredients: "Free-range Chicken",
        },
        {
          name: "Grilled Steak",
          price: 20,
          img: "Perfect-Grilled-Steak-with-Herb-Butter-iowagirleats-Featured-1200x2-1.jpg",
          ingredients: "Ribeye",
        },
        {
          name: "Shawarma Special",
          price: 11,
          img: "picture.jpg",
          ingredients: "Tahini",
        },
        {
          name: "BBQ Wings",
          price: 14,
          img: "bbq-wings.jpg",
          ingredients: "Smoky Sauce",
        },
        {
          name: "Fish & Chips",
          price: 13,
          img: "fish-and-chip-recipe-featured.webp",
          ingredients: "Cod Fish",
        },
        {
          name: "Donuts Deluxe",
          price: 8,
          img: "The-Rolling-Pin-Inside-Out-Bounty-Bar-Donut.webp",
          ingredients: "Belgian Chocolate",
        },
        {
          name: "Gelato Ice Cream",
          price: 9,
          img: "Strawberry-Gelato_EXPS_TOHAM25_212175_P2_MD_04_18_7b.jpg",
          ingredients: "Italian Milk",
        },
        {
          name: "Milkshake",
          price: 10,
          img: "joycone_milkshakes3.jpeg",
          ingredients: "Organic Milk",
        },
        {
          name: "Nachos Supreme",
          price: 11,
          img: "Quick-Easy-Dinner-Nachos-Supreme.jpg",
          ingredients: "Cheese",
        },
        {
          name: "Loaded Fries XL",
          price: 12,
          img: "loaded-fries-4.jpg",
          ingredients: "Beef Bacon",
        },
        {
          name: "Club Sandwich",
          price: 11,
          img: "1386172256516.webp",
          ingredients: "Chicken",
        },
      ];

      let cart = [];

      function openCart() {
        document.getElementById("cartPanel").classList.add("active");
      }

      function closeCart() {
        document.getElementById("cartPanel").classList.remove("active");
      }

      let modalAfterClose = null;

      function showModal(title, message, afterClose) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalMessage").textContent = message;
        modalAfterClose = typeof afterClose === "function" ? afterClose : null;
        document.getElementById("modalOverlay").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.add("hidden");
        if (modalAfterClose) {
          const fn = modalAfterClose;
          modalAfterClose = null;
          fn();
        }
      }

      document
        .getElementById("modalOverlay")
        .addEventListener("click", closeModal);

      function renderMenu() {
        const menu = document.getElementById("menu");
        foods.forEach((food, index) => {
          menu.innerHTML += `
<div class="card">
<img src="${food.img}">
<div class="card-content">
<h3>${food.name}</h3>
<p>$${food.price}</p>
<p><b>Ingredients:</b> ${food.ingredients}</p>
<button onclick="addToCart(${index})">Add to Cart</button>
</div>
</div>`;
        });
      }

      function addToCart(index) {
        cart.push(foods[index]);
        updateCart();
        openCart();
      }

      function updateCart() {
        const cartItems = document.getElementById("cartItems");
        const total = document.getElementById("total");
        cartItems.innerHTML = "";
        let sum = 0;
        cart.forEach((item) => {
          sum += item.price;
          cartItems.innerHTML += `<li>${item.name} - $${item.price}</li>`;
        });
        total.innerText = sum;
      }

      function checkout() {
        const address = document.getElementById("address").value;
        const phone = document.getElementById("phone").value;
        const location = document.getElementById("location").value;
        if (!address || !phone || !location) {
          showModal(
            "Almost there",
            "Please fill in delivery location, street address, and phone number before placing your order.",
          );
          return;
        }
        showModal(
          "Order confirmed",
          `Thanks for ordering from Rafay's Kitchen.\n\nDeliver to: ${location}\n${address}\nPhone: ${phone}`,
          () => {
            cart = [];
            updateCart();
            closeCart();
          },
        );
      }

      renderMenu();
    </script>
  </body>
</html>
